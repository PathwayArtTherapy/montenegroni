<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card generator</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Limelight&family=Poiret+One&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#333;display:grid;place-items:center;min-height:100vh}canvas{max-width:100%;height:auto;box-shadow:0 10px 40px #0008}</style>
</head>
<body>
<!-- Draws the 1200x630 link-preview card. Open this page, right-click the image, "Save image as" assets/og-image.png -->
<canvas id="c" width="1200" height="630"></canvas>
<script>
var C = { navy:'#14213D', gold:'#C9A227', lemon:'#F6E3A1', cream:'#F7F1E1', white:'#FFFDF7', green:'#1F4D3A', sea:'#2E6E8E' };
function draw() {
  var c = document.getElementById('c'), x = c.getContext('2d'), W = 1200, H = 630;
  x.fillStyle = C.navy; x.fillRect(0, 0, W, H);

  // gold sunburst behind
  x.save(); x.translate(W/2, H/2); x.fillStyle = C.gold; x.globalAlpha = .12;
  for (var i = 0; i < 24; i++) { x.rotate(Math.PI/12); x.beginPath(); x.moveTo(0,0); x.lineTo(-40,-1000); x.lineTo(40,-1000); x.closePath(); x.fill(); }
  x.restore();

  // cream panel with double gold rule and corner squares
  x.fillStyle = C.white; x.fillRect(60, 40, 1080, 550);
  x.strokeStyle = C.gold; x.lineWidth = 2; x.strokeRect(76, 56, 1048, 518); x.strokeRect(84, 64, 1032, 502);
  x.fillStyle = C.gold; [[70,50],[1120,50],[70,570],[1120,570]].forEach(function(p){ x.fillRect(p[0], p[1], 10, 10); });

  // fan
  x.save(); x.translate(W/2, 150); x.strokeStyle = C.gold; x.lineWidth = 2;
  [70, 52, 34, 16].forEach(function(r){ x.beginPath(); x.arc(0, 0, r, Math.PI, 0); x.stroke(); });
  for (var a = 0; a <= 6; a++) { var t = Math.PI + a * Math.PI / 6; x.beginPath(); x.moveTo(0,0); x.lineTo(Math.cos(t)*70, Math.sin(t)*70); x.stroke(); }
  x.fillStyle = C.navy; x.beginPath(); x.arc(0, 0, 6, 0, Math.PI*2); x.fill(); x.restore();

  x.textAlign = 'center'; x.textBaseline = 'alphabetic';

  // save the date with swirls
  x.font = '700 22px "DM Sans"'; x.fillStyle = C.navy; x.letterSpacing = '8px';
  x.fillText('SAVE THE DATE', W/2 + 4, 196);
  function swirl(cx, dir) {
    x.save(); x.translate(cx, 188); x.scale(dir, 1); x.strokeStyle = C.gold; x.lineWidth = 2.2; x.lineCap = 'round';
    x.beginPath(); x.moveTo(0, 0); x.bezierCurveTo(24, 0, 26, -14, 42, -14); x.bezierCurveTo(58, -14, 56, 14, 74, 14); x.bezierCurveTo(92, 14, 96, 0, 120, 0); x.stroke();
    x.fillStyle = C.gold; x.beginPath(); x.arc(120, 0, 3, 0, Math.PI*2); x.fill(); x.restore();
  }
  swirl(W/2 + 150, 1); swirl(W/2 - 150, -1);

  // names in script
  x.letterSpacing = '0px'; x.fillStyle = C.navy; x.font = '400 118px "Great Vibes"';
  x.fillText('Lou Lou', W/2 - 190, 318);
  x.fillText('Dylan', W/2 + 230, 318);
  x.font = '400 54px Limelight'; x.fillStyle = C.gold; x.fillText('&', W/2 + 30, 300);

  x.font = '700 28px "Poiret One"'; x.fillStyle = C.navy; x.letterSpacing = '9px';
  x.fillText('A CELEBRATION IN PERAST', W/2 + 4, 378);
  x.letterSpacing = '0px'; x.font = '500 24px "DM Sans"'; x.fillStyle = C.green;
  x.fillText("We're eloping… and then we're throwing a party.", W/2, 418);

  // rule with diamond
  x.strokeStyle = C.gold; x.lineWidth = 1.5;
  [446, 452].forEach(function(y){ x.beginPath(); x.moveTo(160, y); x.lineTo(580, y); x.moveTo(620, y); x.lineTo(1040, y); x.stroke(); });
  x.save(); x.translate(W/2, 449); x.rotate(Math.PI/4); x.fillStyle = C.navy; x.fillRect(-6, -6, 12, 12); x.restore();

  // details
  x.font = '700 16px "DM Sans"'; x.fillStyle = C.gold; x.letterSpacing = '5px';
  x.fillText('WHERE', 290, 492); x.fillText('WHEN', 600, 492); x.fillText('THE BIG DAY', 910, 492);
  x.font = '700 28px "Poiret One"'; x.fillStyle = C.navy; x.letterSpacing = '1px';
  x.fillText('Perast, Montenegro', 290, 528); x.fillText('23 – 30 June 2027', 600, 528); x.fillText('Sat 26 June 2027', 910, 528);

  // water along the bottom
  x.fillStyle = C.sea; x.beginPath(); x.moveTo(0, 612);
  for (var wx = 0; wx < W; wx += 60) x.quadraticCurveTo(wx + 30, 596, wx + 60, 612);
  x.lineTo(W, H); x.lineTo(0, H); x.closePath(); x.fill();
}
Promise.all(['700 22px "DM Sans"','500 24px "DM Sans"','400 118px "Great Vibes"','400 54px Limelight','700 28px "Poiret One"'].map(function(f){ return document.fonts.load(f); })).then(draw);
</script>
</body>
</html>
