<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card generator</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<style>body{margin:0;background:#333;display:grid;place-items:center;min-height:100vh}canvas{max-width:100%;height:auto;box-shadow:0 10px 40px #0008}</style>
</head>
<body>
<!-- Draws the 1200x630 link-preview card: the sealed envelope. Save as assets/og-envelope.png -->
<canvas id="c" width="1200" height="630"></canvas>
<script>
var C = { navy:'#14213D', gold:'#C9A227', gold2:'#E0BE4A', cream:'#F7F1E1', flap:'#EFE5CC', back:'#E9DDBF' };
function draw() {
  var c = document.getElementById('c'), x = c.getContext('2d'), W = 1200, H = 630;
  x.fillStyle = C.navy; x.fillRect(0, 0, W, H);

  // gold sunburst
  x.save(); x.translate(W/2, H*0.47); x.fillStyle = 'rgba(201,162,39,0.14)';
  for (var i = 0; i < 16; i++) { x.beginPath(); var a = i * Math.PI/8; x.moveTo(0,0); x.arc(0,0,1400,a,a+Math.PI/30); x.closePath(); x.fill(); }
  x.restore();

  // envelope geometry (same proportions as the site: 400 x 280)
  var ew = 660, eh = ew*0.7, ex = (W-ew)/2, ey = (H-eh)/2 - 6, k = ew/400;
  function P(px, py) { return [ex + px*k, ey + py*k]; }
  function poly(pts, fill, stroke, lw) { x.beginPath(); pts.forEach(function(p,i){ var q=P(p[0],p[1]); i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]); }); x.closePath(); if(fill){x.fillStyle=fill;x.fill();} if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke();} }

  // shadow + back
  x.save(); x.shadowColor='rgba(0,0,0,0.4)'; x.shadowBlur=40; x.shadowOffsetY=18;
  x.fillStyle = C.back; x.fillRect(ex, ey, ew, eh); x.restore();
  x.strokeStyle = C.gold; x.lineWidth = 1.5; x.strokeRect(ex, ey, ew, eh);

  // front pocket
  poly([[0,0],[200,150],[400,0],[400,280],[0,280]], C.cream);
  x.strokeStyle = C.gold; x.lineWidth = 2.2;
  x.beginPath(); var a=P(0,280), b=P(170,138); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); a=P(400,280); b=P(230,138); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.stroke();

  // flap (closed)
  poly([[0,0],[400,0],[200,168]], C.flap, C.gold, 3);
  x.globalAlpha = .7; x.beginPath(); a=P(28,6); x.moveTo(a[0],a[1]); a=P(200,150); x.lineTo(a[0],a[1]); a=P(372,6); x.lineTo(a[0],a[1]); x.strokeStyle=C.gold; x.lineWidth=1.5; x.stroke(); x.globalAlpha = 1;

  // wax seal
  var sr = 0.23*ew/2, sc = P(200, 168); var cx = sc[0], cy = sc[1] - 0.08*2*sr;
  x.save(); x.shadowColor='rgba(0,0,0,0.35)'; x.shadowBlur=14; x.shadowOffsetY=5;
  x.beginPath(); x.arc(cx, cy, sr, 0, Math.PI*2); x.fillStyle=C.navy; x.fill(); x.restore();
  x.strokeStyle=C.gold; x.lineWidth=4; x.beginPath(); x.arc(cx, cy, sr*0.87, 0, Math.PI*2); x.stroke();
  x.lineWidth=2; x.beginPath(); x.arc(cx, cy, sr*0.77, 0, Math.PI*2); x.stroke();
  x.fillStyle=C.gold2; x.textAlign='center'; x.textBaseline='alphabetic'; x.font='400 '+Math.round(sr*0.42)+'px Limelight'; x.letterSpacing='2px';
  x.fillText('LL&D', cx+1, cy+sr*0.16);
  x.strokeStyle=C.gold; x.lineWidth=2; x.beginPath(); x.moveTo(cx-sr*0.42, cy+sr*0.38); x.lineTo(cx+sr*0.42, cy+sr*0.38); x.stroke();
  x.fillStyle=C.gold; x.beginPath(); x.moveTo(cx, cy+sr*0.29); x.lineTo(cx+sr*0.07, cy+sr*0.38); x.lineTo(cx, cy+sr*0.47); x.lineTo(cx-sr*0.07, cy+sr*0.38); x.closePath(); x.fill();
}
document.fonts.load('400 40px Limelight').then(draw);
</script>
</body>
</html>
